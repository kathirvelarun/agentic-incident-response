<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

    --color-primary-hover:#0056a3;

    --color-canvas:#ffffff;

</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/* ------------------------------------------------------------------
   AIR — Agentic Incident Response
   Standalone reimplementation of "AIR Prototype.dc.html".

   The source file is a Claude design-canvas template (x-dc / sc-if /
   sc-for / x-import bindings) that only runs inside claude.ai's own
   design-canvas runtime (support.js + a private Amex design-system
   bundle). Neither of those is available outside that tool, so this
   file ports the same screens, state machine and styling into plain
   React + CSS that runs in any browser. Color / spacing tokens are
   approximated (the original tokens/*.css files were not resolvable).
------------------------------------------------------------------- */

const { useState, useMemo, useCallback } = React;

// Converts a CSS text string ("color:red;font-size:12px") into a React style object.
function css(str) {
  if (!str) return {};
  const obj = {};
  String(str).split(';').forEach(rule => {
    const idx = rule.indexOf(':');
    if (idx === -1) return;
    let prop = rule.slice(0, idx).trim();
    let val = rule.slice(idx + 1).trim();
    if (!prop || !val) return;
    prop = prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    obj[prop] = val;
  });
  return obj;
}

const NAV_LABELS = [
  ['alerts', 'Alerts'], ['dashboard', 'Dashboard'], ['incidents', 'Incidents'],
  ['alertRules', 'Alert Rules'], ['analytics', 'Analytics'], ['integrations', 'Integrations'], ['settings', 'Settings']
];

function sevColors(sev) {
  if (sev === 'P1' || sev === 'Critical') return { bg: 'rgba(196,0,0,.08)', fg: 'var(--color-error)' };
  if (sev === 'P2' || sev === 'High') return { bg: 'rgba(245,166,35,.15)', fg: '#8a5a00' };
  return { bg: 'var(--color-surface-soft)', fg: 'var(--color-muted)' };
}
function statusColors(s) {
  if (s === 'Investigating') return { bg: 'rgba(245,166,35,.15)', fg: '#8a5a00' };
  if (s === 'Identified') return { bg: 'var(--color-surface-blue-soft)', fg: 'var(--color-primary)' };
  if (s === 'Monitoring') return { bg: 'var(--color-surface-soft)', fg: 'var(--color-muted)' };
  return { bg: 'rgba(0,135,103,.12)', fg: 'var(--color-success)' };
}
function badgeStyle(c) { return 'background:' + c.bg + ';color:' + c.fg + ';font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);white-space:nowrap'; }

function Button({ variant = 'primary', onClick, style, children }) {
  const base = {
    height: 48, padding: '0 22px', borderRadius: 'var(--radius-sm)', fontSize: 14, fontWeight: 600,
    cursor: 'pointer', border: '1px solid transparent', display: 'inline-flex', alignItems: 'center',
    justifyContent: 'center', transition: 'background .15s,border-color .15s,color .15s', whiteSpace: 'nowrap'
  };
  const variants = {
    primary: { background: 'var(--color-primary)', color: 'var(--color-on-primary)', borderColor: 'var(--color-primary)' },
    outline: { background: 'transparent', color: 'var(--color-primary)', borderColor: 'var(--color-primary)' },
    secondary: { background: 'var(--color-canvas)', color: 'var(--color-ink)', borderColor: 'var(--color-hairline)' },
  };
  return <button onClick={onClick} style={{ ...base, ...(variants[variant] || variants.primary), ...style }}>{children}</button>;
}

function StatusSteps({ steps, clickable }) {
  return (
    <div style={css('display:flex;align-items:center')}>
      {steps.map((st, i) => (
        <div key={i} style={css('display:flex;align-items:center;flex:1')}>
          <div style={css('display:flex;flex-direction:column;align-items:center;gap:6px;flex:none')} onClick={clickable ? st.onClick : undefined}>
            <div style={css(st.dotStyle)}>{st.checkMark}</div>
            <div style={css(st.labelStyle)}>{st.label}</div>
          </div>
          {st.hasLine && <div style={css(st.lineStyle)}></div>}
        </div>
      ))}
    </div>
  );
}

function Header({ v }) {
  return (
    <div style={css('height:64px;flex:none;background:var(--color-primary);display:flex;align-items:center;gap:20px;padding:0 20px;min-width:0')}>
      <div style={css('display:flex;align-items:baseline;gap:6px;flex:none')}>
        <span style={css('font-size:14px;font-weight:700;letter-spacing:.04em;color:#fff')}>AMERICAN EXPRESS</span>
        <span style={css('color:rgba(255,255,255,.45)')}>|</span>
        <svg width="16" height="13" viewBox="0 0 40 24" fill="none" style={{ flex: 'none' }}><path d="M0 12H10L14 3L20 21L25 12H40" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
        <span style={css('font-size:14px;font-weight:700;letter-spacing:.06em;color:#fff')}>AIR</span>
      </div>
      <div style={css('display:flex;align-items:center;gap:18px;flex:1;min-width:0;overflow-x:auto')}>
        {v.navItems.map((item, i) => <div key={i} onClick={item.onClick} style={css(item.style)}>{item.label}</div>)}
      </div>
      <div style={css('position:relative;flex:none;width:210px')}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }}><circle cx="11" cy="11" r="7" stroke="#fff" strokeWidth="2" /><path d="M21 21L16.65 16.65" stroke="#fff" strokeWidth="2" strokeLinecap="round" /></svg>
        <input type="text" placeholder="Search incident, INC-CASE or Slack #" className="header-search" style={css('width:100%;height:34px;padding:0 12px 0 32px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:12.5px')} />
      </div>
      <div style={css('display:flex;align-items:center;gap:10px;flex:none')}>
        <div style={css('width:30px;height:30px;border-radius:50%;background:#fff;color:var(--color-primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none')}>AK</div>
        <div style={css('font-size:12.5px;font-weight:500;color:#fff;white-space:nowrap')}>ArunKumar K</div>
        <button onClick={v.logout} style={css('height:32px;padding:0 12px;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:var(--radius-sm);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none')}>Log out</button>
      </div>
    </div>
  );
}

function LoginView({ v }) {
  return (
    <div style={css('min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-surface-soft);padding:32px')}>
      <div style={css('width:460px;max-width:100%;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-md);padding:40px 40px 34px;animation:fadeIn .4s ease')}>
        <div style={css('display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px')}>
          <span style={css('font-size:19px;font-weight:700;letter-spacing:.01em;color:var(--color-primary)')}>AMERICAN EXPRESS</span>
          <span style={css('color:var(--color-hairline);font-size:18px')}>|</span>
          <svg width="20" height="16" viewBox="0 0 40 24" fill="none" style={{ flex: 'none' }}><path d="M0 12H10L14 3L20 21L25 12H40" stroke="var(--color-primary)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
          <span style={css('font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--color-primary)')}>AIR</span>
        </div>
        <div style={css('font-size:14px;color:var(--color-ink);text-align:center;font-weight:500;margin-bottom:28px')}>Agentic Incident Response</div>

        <div style={css('display:flex;flex-direction:column;gap:16px;margin-bottom:16px')}>
          <input type="text" value="you@americanexpress.com" readOnly style={css('width:100%;height:48px;padding:0 16px;border:1px solid var(--color-hairline);border-radius:var(--radius-sm);font-size:15px;background:var(--color-canvas);color:var(--color-ink)')} />
          <input type="password" value="********" readOnly style={css('width:100%;height:48px;padding:0 16px;border:1px solid var(--color-hairline);border-radius:var(--radius-sm);font-size:15px;background:var(--color-canvas);color:var(--color-ink)')} />
        </div>

        <div style={css('display:flex;gap:12px;margin-bottom:26px')}>
          <Button variant="primary" onClick={v.loginDefault} style={css('flex:1')}>Log In</Button>
          <Button variant="outline" onClick={v.loginDefault} style={css('flex:1')}>Continue with SSO</Button>

        <div style={css('font-size:13px;font-weight:600;color:var(--color-ink);margin-bottom:12px')}>Select your role to continue</div>
        <div style={css('display:flex;flex-direction:column;gap:12px')}>
          <div onClick={v.loginAsSRE} style={css(v.sreRoleStyle)}>
            <div>
              <div style={css('font-size:14px;font-weight:600;color:var(--color-ink-strong)')}>SRE Engineer</div>
              <div style={css('font-size:13px;color:var(--color-body-secondary);margin-top:3px')}>View & triage alerts and incidents (Phase 1 — no automation)</div>
            </div>
            <div style={css(v.sreRadioStyle)}><div style={css(v.sreRadioDotStyle)}></div></div>
          </div>
          <div onClick={v.loginAsIC} style={css(v.icRoleStyle)}>

              <div style={css('font-size:13px;color:var(--color-body-secondary);margin-top:3px')}>All Engineer access, plus Integrations & Settings</div>
            </div>
            <div style={css(v.icRadioStyle)}><div style={css(v.icRadioDotStyle)}></div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DashboardScreen({ v }) {
  return (

        <div style={css('display:grid;grid-template-columns:70px 1fr 140px 80px;padding:10px 18px;font-size:11px;font-weight:600;color:var(--color-body-secondary);text-transform:uppercase;letter-spacing:.03em;background:var(--color-surface-soft)')}>
          <div>Sev</div><div>Incident</div><div>Stage</div><div>Age</div>
        </div>
        {v.dashboardIncidents.map((inc, i) => (

            <div><span style={css(inc.sevStyle)}>{inc.sev}</span></div>
            <div style={css('font-weight:500')}>{inc.name}</div>
            <div style={css('color:var(--color-body-secondary)')}>{inc.stage}</div>
            <div style={css("color:var(--color-body-secondary);font-family:'IBM Plex Mono',monospace;font-size:12px")}>{inc.age}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AlertsScreen({ v }) {

      <div style={css('display:flex;align-items:center;justify-content:space-between;margin-bottom:20px')}>

        <Button variant="primary" style={css('padding:0 20px;height:40px')}>Create alert</Button>
      </div>
      <div style={css('background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);overflow-x:auto')}>
        <div style={css('display:grid;grid-template-columns:90px minmax(260px,1fr) 130px 110px 140px 150px 80px;min-width:980px;padding:10px 18px;font-size:11px;font-weight:600;color:var(--color-body-secondary);text-transform:uppercase;letter-spacing:.03em;background:var(--color-surface-soft);gap:10px')}>

        {v.alerts.map((a, i) => (

            <div className="row-hover" onClick={a.onClick} style={css('display:grid;grid-template-columns:90px minmax(260px,1fr) 130px 110px 140px 150px 80px;min-width:980px;gap:10px;padding:13px 18px;font-size:13px;border-top:1px solid var(--color-hairline-soft);align-items:center;cursor:pointer')}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--color-body-secondary)")}>{a.id}</div>
              <div style={css('font-weight:500;padding-right:10px')}>{a.summary}</div>
              <div style={css('color:var(--color-body-secondary);font-size:12.5px')}>{a.source}</div>
              <div style={css('color:var(--color-body-secondary);font-size:12.5px')}>{a.reported}</div>
              <div style={css('display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--color-body-secondary)')}>{a.status}{a.expandable && <span style={css('font-size:10px')}>{a.chevron}</span>}</div>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--color-primary)")}>{a.linked}</div>
              <div><span style={css(a.priorityStyle)}>{a.priority}</span></div>
            </div>
            {a.isExpanded && (
              <div style={css('background:var(--color-surface-soft);border-top:1px solid var(--color-hairline-soft);padding:14px 18px 16px 118px')}>
                <div style={css('font-size:12px;color:var(--color-body-secondary);margin-bottom:10px')}>Grouped by: same service + metric + error signature, within a 5-minute correlation window.</div>
                {a.group.map((g, j) => (
                  <div key={j} style={css('display:flex;align-items:center;gap:16px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--color-hairline-soft)')}>
                    <div style={css("font-family:'IBM Plex Mono',monospace;color:var(--color-body-secondary);width:80px")}>{g.id}</div>
                    <div style={css('flex:1')}>{g.summary}</div>
                    <div style={css('color:var(--color-body-secondary);width:80px')}>{g.time}</div>
                    <div style={css('color:var(--color-body-secondary);width:140px')}>{g.source}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function InvestigationScreen({ v }) {
  return (
    <div style={css('animation:fadeIn .3s ease')}>
      <a href="#" onClick={(e) => { e.preventDefault(); v.backToAlerts(); }} style={css('font-size:12.5px;color:var(--color-body-secondary);display:inline-block;margin-bottom:14px')}>← Back to Alerts</a>
      <div style={css('display:flex;align-items:flex-start;justify-content:space-between;gap:20px;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:20px 24px;margin-bottom:20px')}>
        <div>
          <div style={css('font-size:12px;color:var(--color-body-secondary);margin-bottom:4px')}>Alert 4409234 · AuthDiskSystem</div>
          <div style={css('font-size:22px;font-weight:700;margin-bottom:8px;color:var(--color-ink-strong)')}>AI Investigation — High write latency</div>
          <div style={css('font-size:13px;color:var(--color-primary);display:flex;align-items:center;gap:8px')}>
            <span style={css('width:12px;height:12px;border:2px solid var(--color-primary);border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .9s linear infinite')}></span>
            Investigation in progress · started automatically on alert receipt

        </div>
        <Button variant="primary" onClick={v.openNewIncidentModal} style={css('flex:none')}>Create Incident</Button>
      </div>

      <div style={css('display:flex;gap:28px;border-bottom:1px solid var(--color-hairline);margin-bottom:20px')}>
        {v.investigationTabs.map((t, i) => <div key={i} onClick={t.onClick} style={css(t.style)}>{t.label}</div>)}
      </div>

      {v.isInvKeyFindings && (
        <div style={css('display:flex;flex-direction:column;gap:12px')}>
          {v.keyFindings.map((f, i) => (
            <div key={i} style={css('display:flex;gap:14px;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:18px 20px;align-items:flex-start')}>
              <div style={css('width:10px;height:10px;border-radius:50%;background:var(--color-primary);margin-top:6px;flex:none')}></div>
              <div>
                <div style={css('font-size:15px;font-weight:700;color:var(--color-ink-strong)')}>{f.main}</div>

      {v.isInvRca && (
        <div style={css('background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:18px;font-size:13.5px;line-height:1.6')}>
          Deploy #4489 to auth-service modified disk I/O batching configuration 6 minutes before the latency spike. Write latency on AuthDiskSystem crossed 412ms — 2x the 200ms threshold — sustained for 90 seconds on host auth-disk-03. No matching pattern in the last 30 days rules out a recurring issue.
          <div style={css('margin-top:12px;font-size:12px;font-weight:600;color:var(--color-success)')}>Confidence: 78%</div>
        </div>
      )}
      {v.isInvRecommendation && (
        <div style={css('display:flex;flex-direction:column;gap:12px')}>
          <div style={css('background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:16px 18px')}>
            <div style={css('font-size:13.5px;font-weight:600;margin-bottom:4px')}>Roll back deploy #4489</div>
            <div style={css('font-size:12.5px;color:var(--color-body-secondary)')}>Restores prior disk I/O batching configuration. Estimated resolution: 3 min.</div>
          </div>
          <div style={css('background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:16px 18px')}>
            <div style={css('font-size:13.5px;font-weight:600;margin-bottom:4px')}>Monitor auth-disk-03 post-rollback</div>
            <div style={css('font-size:12.5px;color:var(--color-body-secondary)')}>Watch write latency for 15 min before closing the alert.</div>
          </div>
        </div>
      )}
      {v.isInvLogEvidence && (
        <div style={css("background:var(--color-ink-strong);color:var(--color-hairline-soft);border-radius:var(--radius-sm);padding:16px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.8;overflow-x:auto")}>

      { time: '14:04:01', text: 'RCA Agent reached 82% confidence' },
      { time: '14:07:00', text: 'Rollback assigned to on-call engineer' },
      { time: '14:19:00', text: 'Error rate normalized, incident resolved' },
    ];

    const incidentsListRaw = [
      { sev: 'P1', title: 'Checkout errors spiking 8x baseline', linked: 'INC-CASE-2323223', service: 'checkout-svc', createdBy: 'ArunKumar K', status: 'Investigating', slack: '#inc-case-2323223', onClick: () => setState({ screen: 'incidentDetail', incidentTab: 'overview' }) },
      { sev: 'P2', title: 'Payments API p99 latency > 4s', linked: 'INC-CASE-2323198', service: 'payments-api', createdBy: 'Alex Chen', status: 'Identified', slack: 'Create Slack channel', onClick: () => {} },
      { sev: 'P2', title: 'Search indexing lag', linked: 'INC-CASE-2318802', service: 'search-svc', createdBy: 'Priya Nair', status: 'Resolved', slack: '#inc-case-2318802 (archived)', onClick: () => {} },
    ];
    const incidentsList = incidentsListRaw.map(i => ({ ...i, sevStyle: badgeStyle(sevColors(i.sev)), statusStyle: badgeStyle(statusColors(i.status)) }));

    const runbookStepsRaw = [
      { n: 1, title: 'Verify current pool utilization', desc: 'kubectl exec into checkout-db-primary, check active connections' },
      { n: 2, title: 'Revert config #4471', desc: 'restores max-connections to 200' },
      { n: 3, title: 'Restart connection pool', desc: 'graceful restart, zero downtime' },
      { n: 4, title: 'Verify error rate < 1% for 5 min', desc: 'manual sign-off required' },
    ];
    const runbookSteps = runbookStepsRaw.map((r, i) => {
      const done = s.runbookDone[i];
      return {
        ...r,
        onClick: () => setState(st => { const arr = st.runbookDone.slice(); arr[i] = !arr[i]; return { runbookDone: arr }; }),
        rowStyle: 'display:flex;gap:12px;align-items:flex-start;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer' + (done ? ';opacity:.55' : ''),
        checkStyle: 'width:20px;height:20px;border-radius:var(--radius-xs);border:2px solid ' + (done ? 'var(--color-success)' : 'var(--color-hairline)') + ';background:' + (done ? 'var(--color-success)' : 'var(--color-canvas)') + ';color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px',
        checkMark: done ? '✓' : '',
      };
    });

    const statusOrder = ['Investigating', 'Identified', 'Monitoring', 'Resolved'];
    const currentStatusIdx = statusOrder.indexOf(s.incidentStatus);
    const statusSteps = statusOrder.map((label, i) => {
      const isLast = i === statusOrder.length - 1;
      const done = i < currentStatusIdx || (isLast && i === currentStatusIdx);
      const active = i === currentStatusIdx;
      return {
        label,
        hasLine: i < statusOrder.length - 1,
        checkMark: done ? '✓' : '',
        onClick: () => setState({ incidentStatus: label }),
        dotStyle: 'cursor:pointer;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;'
          + (done ? 'background:var(--color-primary)' : active ? 'background:var(--color-primary);box-shadow:0 0 0 3px var(--color-surface-blue-soft)' : 'background:var(--color-hairline);color:var(--color-muted)'),
        labelStyle: 'font-size:11.5px;font-weight:' + (active ? '700' : '500') + ';color:' + (active ? 'var(--color-primary)' : done ? 'var(--color-ink)' : 'var(--color-muted)') + ';white-space:nowrap',
        lineStyle: 'flex:1;height:2px;margin:0 8px 20px;background:' + (i < currentStatusIdx ? 'var(--color-primary)' : 'var(--color-hairline)'),
      };
    });

    const slackMessages = [
      { tag: 'AI', who: 'AIR bot', time: '', text: 'Incident INC-CASE-2323223 created from AI Investigation. Current status: Investigating.' },
      { tag: 'AK', who: 'ArunKumar K', time: '10:42 AM', text: '/incident-status resolved INC-CASE-2323223' },
      { tag: 'AI', who: 'AIR bot', time: '', text: '✅ Status updated to Resolved by ArunKumar K. Starting Retrospective generation for INC-CASE-2323223' },
    ].map(m => ({ ...m, avatarStyle: 'width:30px;height:30px;border-radius:var(--radius-xs);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;' + (m.tag === 'AI' ? 'background:var(--color-surface-blue-soft);color:var(--color-primary)' : 'background:var(--color-hairline-soft);color:var(--color-body-secondary)') }));

    const rulesRaw = [
      { condition: 'error_rate > 5% for 2m', service: 'checkout-svc', severity: 'P1', threshold: '5%' },
      { condition: 'p99_latency > 3s for 5m', service: 'payments-api', severity: 'P2', threshold: '3000ms' },
      { condition: 'pod_restarts > 3 in 10m', service: 'auth-service', severity: 'P3', threshold: '3 restarts' },
    ];
    const rules = rulesRaw.map((r, i) => {
      const on = s.rulesEnabled[i];
      return {
        ...r, sevStyle: badgeStyle(sevColors(r.severity)),
        toggle: () => setState(st => { const arr = st.rulesEnabled.slice(); arr[i] = !arr[i]; return { rulesEnabled: arr }; }),
        switchTrackStyle: 'width:38px;height:22px;border-radius:var(--radius-pill);padding:2px;cursor:pointer;background:' + (on ? 'var(--color-primary)' : 'var(--color-hairline)'),
        switchDotStyle: 'width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;transform:translateX(' + (on ? '16px' : '0') + ')',
      };
    });

    const integrationsRaw = [
      { abbr: 'ELF', name: 'Enterprise Log Feed', desc: 'ingestion source', connected: true, key: 'elf' },
      { abbr: 'SLK', name: 'Slack', desc: 'Notifications & incident channel updates', connected: true, key: 'slack' },
      { abbr: 'JRA', name: 'JIRA', desc: 'Create / update issues automatically', connected: s.jiraConnected, key: 'jira' },
    ];
    const integrations = integrationsRaw.map(ig => ({
      ...ig,
      statusStyle: badgeStyle(ig.connected ? { bg: 'rgba(0,135,103,.12)', fg: 'var(--color-success)' } : { bg: 'var(--color-surface-soft)', fg: 'var(--color-muted)' }),
      statusLabel: ig.connected ? 'Connected' : 'Not connected',
      actionLabel: ig.connected ? 'Configure' : 'Connect',
      action: ig.key === 'jira' ? (() => setState({ jiraConnected: true })) : (() => {}),
    }));

    const mttrValues = [34, 31, 28, 26, 23, 22, 21];
    const maxMttr = Math.max(...mttrValues);
    const mttrWeeks = mttrValues.map((val, i) => ({
      value: val + 'm', label: 'W' + (i + 1),
      barStyle: 'width:22px;border-radius:var(--radius-xs) var(--radius-xs) 0 0;background:' + (i === mttrValues.length - 1 ? 'var(--color-primary)' : 'var(--color-surface-blue-soft)') + ';height:' + Math.round((val / maxMttr) * 100) + '%'
    }));

    const settingsTabDefs = [['general', 'General'], ['users', 'Users & Roles'], ['policy', 'Policy Engine'], ['audit', 'Audit Log']];
    const settingsTabs = settingsTabDefs.map(([key, label]) => {
      const active = s.settingsTab === key;
      return {
        label, onClick: () => setState({ settingsTab: key }),
        style: 'padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid ' + (active ? 'var(--color-primary)' : 'transparent') + ';color:' + (active ? 'var(--color-ink-strong)' : 'var(--color-body-secondary)')
      };
    });

    const users = [
      { name: 'ArunKumar K', role: 'SRE Engineer', canApprove: 'No' },
      { name: 'Priya Nair', role: 'Incident Commander', canApprove: 'No' },
      { name: 'Alex Chen', role: 'SRE Engineer', canApprove: 'No' },
    ];

    const roleRowStyle = (selected) => 'display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid ' + (selected ? 'var(--color-primary)' : 'var(--color-hairline)') + ';border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer';
    const radioStyle = (selected) => 'width:20px;height:20px;border-radius:50%;flex:none;border:2px solid ' + (selected ? 'var(--color-primary)' : 'var(--color-hairline)') + ';display:flex;align-items:center;justify-content:center';
    const radioDotStyle = (selected) => 'width:10px;height:10px;border-radius:50%;background:' + (selected ? 'var(--color-primary)' : 'transparent');

    return {
      isLogin: !s.loggedIn,
      isApp: s.loggedIn,
      loginDefault: () => setState({ loggedIn: true, role: s.selectedRole, screen: 'dashboard' }),
      loginAsSRE: () => setState({ selectedRole: 'SRE Engineer' }),
      loginAsIC: () => setState({ selectedRole: 'Incident Commander' }),
      sreRoleStyle: roleRowStyle(s.selectedRole === 'SRE Engineer'),
      icRoleStyle: roleRowStyle(s.selectedRole === 'Incident Commander'),
      sreRadioStyle: radioStyle(s.selectedRole === 'SRE Engineer'),
      icRadioStyle: radioStyle(s.selectedRole === 'Incident Commander'),
      sreRadioDotStyle: radioDotStyle(s.selectedRole === 'SRE Engineer'),
      icRadioDotStyle: radioDotStyle(s.selectedRole === 'Incident Commander'),
      roleLabel: s.role,
      logout: () => setState({ loggedIn: false, screen: 'dashboard' }),
      navItems,

      isDashboard: s.screen === 'dashboard',
      statCards, dashboardIncidents,

      isAlerts: s.screen === 'alerts',
      alerts,

      isInvestigation: s.screen === 'investigation',
      backToAlerts: () => setState({ screen: 'alerts' }),
      openNewIncidentModal: () => setState({ showNewIncidentModal: true }),
      investigationTabs,
      isInvKeyFindings: s.investigationTab === 'keyFindings', keyFindings,
      isInvRca: s.investigationTab === 'rca',
      isInvRecommendation: s.investigationTab === 'recommendation',
      isInvLogEvidence: s.investigationTab === 'logEvidence',
      isInvDeployment: s.investigationTab === 'deployment',

      isIncidents: s.screen === 'incidents',
      incidentsList,

      isIncidentDetail: s.screen === 'incidentDetail',
      backToIncidents: () => setState({ screen: 'incidents' }),
      goToSlack: () => setState({ screen: 'slack' }),
      incidentTabs,
      isTabOverview: s.incidentTab === 'overview', investigationSteps,
      isTabKeyFactors: s.incidentTab === 'keyFactors', keyFactors,
      isTabRca: s.incidentTab === 'rca', hypotheses, remediations,
      goToRunbook: () => setState({ screen: 'runbook' }),
      isTabTimeline: s.incidentTab === 'timeline', timelineItems,
      isTabRetrospective: s.incidentTab === 'retrospective',
      retroGenerated: s.retroGenerated,
      retroNotGenerated: !s.retroGenerated,
      retroSaved: s.retroSaved,
      retroNotSaved: !s.retroSaved,
      generateRetroInline: () => setState({ retroGenerated: true }),
      saveRetro: () => setState({ retroSaved: true }),

      isRunbook: s.screen === 'runbook',
      backToIncidentRca: () => setState({ screen: 'incidentDetail', incidentTab: 'rca' }),
      runbookSteps,

      isSlack: s.screen === 'slack',
      slackMessages,
      statusSteps,
      openRetroModal: () => setState({ showRetroModal: true }),

      isRetrospectiveDoc: s.screen === 'retrospectiveDoc',

      isAlertRules: s.screen === 'alertRules',
      rules,

      isIntegrations: s.screen === 'integrations',
      integrations,

      isAnalytics: s.screen === 'analytics',
      mttrWeeks,

      isSettings: s.screen === 'settings',
      settingsTabs,
      isSettingsGeneral: s.settingsTab === 'general',
      isSettingsUsers: s.settingsTab === 'users', users,
      isSettingsPolicy: s.settingsTab === 'policy',
      togglePolicy1: () => setState(st => ({ policy1: !st.policy1 })),
      togglePolicy2: () => setState(st => ({ policy2: !st.policy2 })),
      policy1SwitchStyle: 'width:38px;height:22px;border-radius:var(--radius-pill);padding:2px;cursor:pointer;background:' + (s.policy1 ? 'var(--color-primary)' : 'var(--color-hairline)'),
      policy1DotStyle: 'width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;transform:translateX(' + (s.policy1 ? '16px' : '0') + ')',
      policy2SwitchStyle: 'width:38px;height:22px;border-radius:var(--radius-pill);padding:2px;cursor:pointer;background:' + (s.policy2 ? 'var(--color-primary)' : 'var(--color-hairline)'),
      policy2DotStyle: 'width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;transform:translateX(' + (s.policy2 ? '16px' : '0') + ')',
      isSettingsAudit: s.settingsTab === 'audit',

      showNewIncidentModal: s.showNewIncidentModal,
      closeNewIncidentModal: () => setState({ showNewIncidentModal: false }),
      createIncident: () => setState({ showNewIncidentModal: false, screen: 'incidents' }),

      showRetroModal: s.showRetroModal,
      closeRetroModal: () => setState({ showRetroModal: false }),
      generateRetro: () => setState({ showRetroModal: false, screen: 'retrospectiveDoc' }),
    };
  }, [state, setState]);

  return (
    <React.Fragment>
      {v.isLogin && <LoginView v={v} />}
      {v.isApp && (
        <div style={css('min-height:100vh;background:var(--color-surface-soft);padding:24px;display:flex;justify-content:center')}>
          <div style={css('width:100%;max-width:1600px;border:1px solid var(--color-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-soft-lift);overflow:hidden;background:var(--color-canvas);display:flex;flex-direction:column')}>
            <Header v={v} />
            <div style={css('flex:1;min-width:0;max-width:var(--container-max);width:100%;margin:0 auto;padding:28px 36px 60px;overflow-x:hidden')}>
              {v.isDashboard && <DashboardScreen v={v} />}
              {v.isAlerts && <AlertsScreen v={v} />}
              {v.isInvestigation && <InvestigationScreen v={v} />}
              {v.isIncidents && <IncidentsScreen v={v} />}
              {v.isIncidentDetail && <IncidentDetailScreen v={v} />}
              {v.isRunbook && <RunbookScreen v={v} />}
              {v.isSlack && <SlackScreen v={v} />}
              {v.isRetrospectiveDoc && <RetrospectiveDocScreen v={v} />}
              {v.isAlertRules && <AlertRulesScreen v={v} />}
              {v.isIntegrations && <IntegrationsScreen v={v} />}
              {v.isAnalytics && <AnalyticsScreen v={v} />}
              {v.isSettings && <SettingsScreen v={v} />}
            </div>
          </div>
        </div>
      )}
      {v.showNewIncidentModal && <NewIncidentModal v={v} />}
      {v.showRetroModal && <RetroModal v={v} />}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
